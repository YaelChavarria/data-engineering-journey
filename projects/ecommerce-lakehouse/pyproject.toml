[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-lakehouse"
version = "0.1.0"
description = "Reproducible e-commerce lakehouse with Bronze, Silver and Gold layers"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1,<2",
    "dbt-duckdb>=1.9,<2",
    "streamlit>=1.40,<2",
]

[project.scripts]
ecommerce-lakehouse = "ecommerce_lakehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
