version: 2

models:
  - name: gold_dim_customer
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: email
        tests: [not_null]
  - name: gold_dim_product
    columns:
      - name: product_id
        tests: [not_null, unique]
  - name: gold_fact_order
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('gold_dim_customer')
                field: customer_id
      - name: order_status
        tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'cancelled']
      - name: net_revenue
        tests: [not_null]
      - name: leakage_amount
        tests: [not_null]
  - name: gold_daily_sales
    columns:
      - name: order_date
        tests: [not_null, unique]
  - name: gold_product_sales
    columns:
      - name: product_id
        tests: [not_null, unique]
  - name: gold_operations_daily
    columns:
      - name: order_date
        tests: [not_null, unique]
      - name: net_revenue
        tests: [not_null]
      - name: late_delivery_rate
        tests: [not_null]
  - name: gold_revenue_leakage
    columns:
      - name: leakage_type
        tests: [not_null, unique]
      - name: leakage_amount
        tests: [not_null]
