[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "client-data-ops-hub"
version = "0.1.0"
description = "A reproducible client data delivery service with quality gates and SLA evidence"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1,<2",
    "dbt-duckdb>=1.9,<2",
    "pandas>=2.2,<3",
    "streamlit>=1.40,<2",
]

[project.scripts]
client-data-ops = "client_data_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
