name: NYC Taxi Pipeline Tests

on:
  push:
    paths:
      - "projects/nyc-taxi-pipeline/**"
      - ".github/workflows/nyc-taxi-pipeline.yml"
  pull_request:
    paths:
      - "projects/nyc-taxi-pipeline/**"
      - ".github/workflows/nyc-taxi-pipeline.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/nyc-taxi-pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
