name: ecommerce-lakehouse-ci

on:
  push:
    paths:
      - "projects/ecommerce-lakehouse/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "projects/ecommerce-lakehouse/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ecommerce-lakehouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
